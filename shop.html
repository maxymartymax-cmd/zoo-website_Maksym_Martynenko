<!DOCTYPE html>
<html lang="eng">
<head>
    <title>Zoo Everwild - Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu">
        <div class="logo">ZOO</div>
        <a href="index.html">Home</a>
        <a href="calendar.html">Calendar</a>
        <a href="gallery.html">Gallery</a>
        <a href="map.html">Map</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact us</a>
    </div>

    <div class="shop-header">
        <img src="shop_header.png" alt="Zoo shop" class="shop-banner">

        <!-- Cards above the thickets list -->
        <div class="tickets-overlay">
            
            <!--Left card ZOO TICKET -->
            <div class="ticket-card">
                <div class="badge yellow-badge">ZOO TICKET</div>
                <div class="ticket-info">
                    <p>Single - £5.00</p>
                    <p>Family - £17.50</p>
                </div>
            </div>

            <!--Right Card ZOO CARD -->
            <div class="ticket-card">
                <div class="badge oval-badge">
                    <span>ZOO</span>
                    <div class="badge-line"></div>
                    <span>CARD</span>
                </div>
                <!--Text inside this card-->
                <div class="ticket-info">
                    <p>Annual - $30.00</p>
                    <p>VIP - $50.00</p>
                </div>
            </div>

        </div>
    </div>
</div>
    
<!-- Раздел с товарами ниже шапки -->
<div class="shop-products-section">
    <div class="products-grid">
        
        <!-- Карточка 1 -->
    <div class="product-card">
        <h3>Adult Ticket</h3>
        <p class="product-desc">Full day entrance</p>
        <span class="price-value">£15.00</span>
        <button class="buy-btn">Buy</button>
    </div>

    <!-- Карточка 2 -->
    <div class="product-card">
        <h3>Child Ticket</h3>
        <p class="product-desc">Ages 3-12 years</p>
        <span class="price-value">£8.00</span>
        <button class="buy-btn">Buy</button>
    </div>

    <!-- Карточка 3 -->
    <div class="product-card">
        <h3>Family Pass</h3>
        <p class="product-desc">2 Adults + 2 Kids</p>
        <span class="price-value">£38.00</span>
        <button class="buy-btn">Buy</button>
    </div>

    <!-- Карточка 4 -->
    <div class="product-card">
        <h3>Annual Pass</h3>
        <p class="product-desc">Unlimited visits</p>
        <span class="price-value">£75.00</span>
        <button class="buy-btn">Buy</button>
    </div>

</div>

</body>

</html>
