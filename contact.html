<!DOCTYPE html>
<html lang="eng">
<head>
    <title>Zoo Everwild - Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

    <div class="menu">
        <div class="logo">ZOO</div>
        <a href="index.html">Home</a>
        <a href="calendar.html">Calendar</a>
        <a href="gallery.html">Gallery</a>
        <a href="map.html">Map</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html" class="active">Contact us</a>
    </div>

<!-- Основная секция формы -->
<div class="contact-container">
    
    <h2 class="contact-subtitle">Contact us</h2>
    <div class="contact-header">
        <img src="header_contact.png" alt="Image">
    </div>

    <form class="contact-form">
        
        <!-- Поля имени и Email в один ряд -->
        <div class="form-row">
            <input type="text" placeholder="Your Name*" required class="form-input half-input">
            <input type="email" placeholder="Your Email*" required class="form-input half-input">
        </div>

        <!-- Поле телефона -->
        <input type="tel" placeholder="Phone Number" class="form-input full-input">

        <!-- Выпадающий список -->
        <div class="select-wrapper">
            <select class="form-input full-input form-select">
                <option value="" disabled selected hidden>How did you hear about us</option>
                <option value="social">Social Media</option>
                <option value="friends">Friends / Family</option>
                <option value="search">Search Engine</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Текстовое поле для сообщения -->
        <textarea placeholder="Let us know how we can help?*" required class="form-textarea"></textarea>

        <!-- Чекбокс рассылки -->
        <label class="checkbox-label">
            <input type="checkbox">
            <span>Sign me up for the newsletters.</span>
        </label>

        <!-- Кнопка отправки -->
        <div class="submit-wrapper">
            <button type="submit" class="submit-btn">Submit</button>
        </div>

    </form>
</div>


</body>

</html>
